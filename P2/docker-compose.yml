

services:

  user_api:
    build:
      context: .
      network: host

    ports:
      - "5050:5050"

    command: python3 user.py

    volumes:
      - ./:/app

    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      network: host

    ports:
      - "5051:5051"

    command: python3 api.py

    volumes:
      - ./:/app

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: alumnodb
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: si1

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./populate.sql:/docker-entrypoint-initdb.d/02-populate.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumnodb -d si1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
